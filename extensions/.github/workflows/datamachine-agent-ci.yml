# Reusable wrapper for Data Machine agent CI runs.
#
# Consumers receive one stable `engine_data_json` output. GitHub Actions cannot
# create dynamic workflow_call outputs from `engine_data_outputs`, so callers
# should parse that JSON map in their own workflow when they need named fields.
# The `auth_mode` output reports whether the run used a Homeboy GitHub App token
# or the repository-scoped GitHub Actions token fallback.
name: Data Machine Agent CI (reusable)

'on':
  workflow_call:
    inputs:
      bundle_path:
        type: string
        required: true
      homeboy_extensions_ref:
        description: Ref of Extra-Chill/homeboy-extensions to check out for runner scripts.
        type: string
        default: main
      bundle_repo:
        description: Optional git URL for an external bundle repository. When set, the runner clones this repo and uses bundle_path_in_repo inside it.
        type: string
        default: ""
      bundle_ref:
        description: Ref to check out from bundle_repo. Defaults to the current workflow SHA when bundle_repo is empty.
        type: string
        default: ""
      bundle_path_in_repo:
        description: Path to the bundle inside bundle_repo. Defaults to bundle_path.
        type: string
        default: ""
      agent_slug:
        type: string
        required: true
      pipeline_slug:
        type: string
        required: true
      flow_slug:
        type: string
        required: true
      target_repo:
        type: string
        required: true
      prompt:
        type: string
        default: ""
      run_agent:
        description: When false, record a skipped run and bypass agent setup/execution.
        type: boolean
        default: true
      provider:
        type: string
        default: openai
      provider_plugin:
        description: |
          JSON object describing the AI provider plugin to mount and configure.
          WP Codebox handles the default provider runtime. Use this only for an explicit extra provider plugin.
          Supported keys: repo, ref, path, register_function, credentials.
          credentials maps Data Machine option names to bench env names.
        type: string
        default: "{}"
      model:
        type: string
        default: gpt-5.5
      validation_dependencies:
        description: Comma-separated additional OWNER/REPO or OWNER/REPO@REF entries checked out under .ci/<repo>. Entries without @REF use the repository default branch.
        type: string
        default: ""
      context_repositories:
        description: JSON array of read-only DMC context repositories. Each entry is {repo, ref, alias, paths} where paths is optional.
        type: string
        default: "[]"
      verification_commands:
        description: JSON array of deterministic shell commands to run in the target workspace after the agent run. Entries may be strings or {command, description} objects.
        type: string
        default: "[]"
      drift_checks:
        description: JSON array of generated-output drift checks to run in the target workspace after verification. Entries may be strings or {command, description} objects.
        type: string
        default: "[]"
      writable_paths:
        description: Comma-separated or JSON array of target workspace paths the agent may change. Empty disables host-side path enforcement.
        type: string
        default: ""
      workspace_contract_checks:
        description: JSON object of generic host-side post-run workspace checks. Supports paths_exist, glob_min_count, entry_points, and forbidden_phrases.
        type: string
        default: "{}"
      include_agent_runtime_dependencies:
        description: "Include the standard WordPress agent runtime stack: Agents API, Data Machine, and Data Machine Code."
        type: boolean
        default: true
      agent_runtime:
        description: Runtime substrate id. Currently only wp-codebox is supported.
        type: string
        default: wp-codebox
      agent_runtime_ref:
        description: Runtime substrate ref. For agent_runtime=wp-codebox this is the Automattic/wp-codebox ref.
        type: string
        default: main
      agents_api_ref:
        description: Ref for Automattic/agents-api when include_agent_runtime_dependencies is true.
        type: string
        default: main
      data_machine_ref:
        description: Ref for Extra-Chill/data-machine when include_agent_runtime_dependencies is true.
        type: string
        default: main
      data_machine_code_ref:
        description: Ref for Extra-Chill/data-machine-code when include_agent_runtime_dependencies is true.
        type: string
        default: main
      openai_provider_ref:
        description: Ref for WordPress/ai-provider-for-openai when mounting the default OpenAI provider plugin.
        type: string
        default: trunk
      runtime_wordpress_version:
        description: WordPress version used by the selected WordPress-capable runtime.
        type: string
        default: "7.0"
      success_requires_pr:
        type: boolean
        default: true
      success_completion_outcomes:
        description: |
          JSON array of Data Machine completion outcome names that may satisfy
          success_requires_pr when no PR is opened. File writes without PRs
          still fail. Default '[]' preserves PR-required behavior.
        type: string
        default: "[]"
      max_turns:
        type: number
        default: 12
      step_budget:
        type: number
        default: 16
      time_budget_ms:
        type: number
        default: 600000
      engine_data_outputs:
        description: JSON map of output_name to jq path, collected into engine_data_json.
        type: string
        default: "{}"
      expected_artifacts:
        description: JSON array of generic expected artifact names forwarded to WP Codebox.
        type: string
        default: "[]"
      artifact_declarations:
        description: JSON array of typed artifact declarations forwarded to WP Codebox. Required declarations are enforced in the normalized Homeboy outcome.
        type: string
        default: "[]"
      transcript_artifact_name:
        description: Empty string disables transcript artifact upload.
        type: string
        default: ""
      replay_bundle_artifact_name:
        description: Empty string disables replay bundle generation and artifact upload.
        type: string
        default: ""
      artifact_export_config:
        description: JSON config for exporting bundle-file artifacts back to the target repo. Set include_job_artifacts true to also commit full job artifact JSON.
        type: string
        default: "{}"
      rules:
        description: JSON object describing eval rule policy for the task. Preserved in metadata.eval_artifact.rules.
        type: string
        default: "{}"
      general_rules:
        description: JSON array of reusable eval rule IDs that apply to the task.
        type: string
        default: "[]"
      task_rules:
        description: JSON array of task-specific eval rule IDs that apply to the task.
        type: string
        default: "[]"
      probes:
        description: JSON object of zero-weight behavioral probes to preserve in eval metadata.
        type: string
        default: "{}"
      wp_gym_benchmark_mode:
        description: Fail the wp-gym eval row projection when required replay/evidence references are missing.
        type: boolean
        default: false
      comment_pr_summary:
        type: boolean
        default: false
      bundle_validator_spec:
        description: Optional repo-relative validate-bundle spec JSON path.
        type: string
        default: ""
      app_token_repos:
        description: Comma-separated OWNER/REPO entries for the Homeboy app token. Defaults to target_repo.
        type: string
        default: ""
      require_homeboy_app_token:
        description: Fail before running the agent when Homeboy app credentials are unavailable.
        type: boolean
        default: false
      allowed_repos:
        description: JSON array of OWNER/REPO strings the injected GitHub profile may access. Defaults to app_token_repos when provided, otherwise [target_repo].
        type: string
        default: "[]"
      engine_key:
        description: Optional engine data key used by built-in tool result capture and runner publication metadata.
        type: string
        default: ""
      tool_results_key:
        description: Engine data field used for captured tool results.
        type: string
        default: github_tool_results
      dry_run:
        description: Build runner config and exercise the runner dry-run path without a live agent call.
        type: boolean
        default: false
      extra_wp_config_defines:
        description: |
          JSON object merged into the runner config wp_config_defines.
          Default '{}' means no extra defines.
        type: string
        default: "{}"
      runtime_mounts:
        description: |
          JSON string array appended to the selected runtime mounts after the
          default ci-driver fixture mount. Entries may be SOURCE:TARGET[:MODE]
          strings or objects with source, target, mode, and optional type
          (directory or file). Default '[]' means no extra mounts.
        type: string
        default: "[]"
      runtime_overlays:
        description: JSON array of runtime overlay entries forwarded to the runner config runtime_overlays.
        type: string
        default: "[]"
      workload_run_before:
        description: |
          JSON array of pre-run hooks executed before the main bench workload
          inside the WordPress sandbox. Each entry is { type, file } the same way
          wp_codebox_workloads[*].run entries are. Default '[]' means no
          pre-run hook.
        type: string
        default: "[]"
      workload_run_after:
        description: |
          JSON array of post-run hooks executed after the agent workload inside
          the same WordPress scenario. Use this for verifier probes that assert
          the agent left WordPress in a valid state. Default '[]' means no
          post-run hook.
        type: string
        default: "[]"
      daily_memory_enabled:
        description: |
          When true, sets daily_memory_enabled in the runner config so the
          imported agent runs with daily memory storage on. Default false.
        type: boolean
        default: false
      disable_datamachine_directives:
        description: |
          When true, disables Data Machine's directive stack before agent
          requests are assembled. Use for eval/training runs where benchmark
          prompts must not inherit runner system context.
        type: boolean
        default: false
      extra_required_abilities:
        description: |
          JSON array of additional ability slugs the runner must assert are
          registered before invoking the agent. Default '[]' means rely on
          the runner's built-in ability set (datamachine/import-agent,
          datamachine/run-flow or datamachine/execute-workflow, datamachine/drain-job).
        type: string
        default: "[]"
      ability_tools:
        description: JSON array of additional tool definitions backed by WordPress abilities.
        type: string
        default: "[]"
      tool_recorders:
        description: JSON array of existing tool recorder configs for field projection, forced parameters, and tool result capture.
        type: string
        default: "[]"
      enable_terminal_actions:
        description: Expose runner-owned terminal tools such as run_wp_cli to the agent.
        type: boolean
        default: false
      wp_cli_tool_name:
        description: Tool name used when enable_terminal_actions registers the WP-CLI terminal tool.
        type: string
        default: run_wp_cli
      pipeline_step_patches:
        description: JSON array of patches applied to imported pipeline step configs before the flow runs.
        type: string
        default: "[]"
      flow_step_patches:
        description: JSON array of patches applied to imported flow step configs before the flow runs.
        type: string
        default: "[]"
      runner_workspace:
        description: JSON object for runner-owned Data Machine Code workspace/worktree provisioning before the agent runs. Set agent_alias to expose an opaque project name instead of the real workspace handle.
        type: string
        default: "{}"
      actions_artifact_downloads:
        description: JSON array of GitHub Actions artifacts to download before the agent run. Each item supports repo, run_id, name, and dir.
        type: string
        default: "[]"
      execute_workflow_builder_command:
        description: Optional shell command run after artifact downloads to build an execute-workflow JSON payload.
        type: string
        default: ""
      execute_workflow_path:
        description: Optional workspace-relative JSON payload path for datamachine/execute-workflow. When set, the runner executes this ephemeral workflow instead of run-flow.
        type: string
        default: ""
    secrets:
      HOMEBOY_APP_ID:
        required: false
      HOMEBOY_APP_PRIVATE_KEY:
        required: false
      OPENAI_API_KEY:
        required: false
      PROVIDER_SECRET_1:
        required: false
      PROVIDER_SECRET_2:
        required: false
      PROVIDER_SECRET_3:
        required: false
      PROVIDER_SECRET_4:
        required: false
      PROVIDER_SECRET_5:
        required: false
    outputs:
      job_status:
        value: ${{ jobs.run-agent.outputs.job_status }}
      transcript_json:
        value: ${{ jobs.run-agent.outputs.transcript_json }}
      transcript_summary:
        value: ${{ jobs.run-agent.outputs.transcript_summary }}
      engine_data_json:
        value: ${{ jobs.run-agent.outputs.engine_data_json }}
      auth_mode:
        value: ${{ jobs.run-agent.outputs.auth_mode }}

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      job_status: ${{ steps.extract.outputs.job_status || steps.extract_dry_run.outputs.job_status || steps.skipped.outputs.job_status }}
      transcript_json: ${{ steps.extract.outputs.transcript_json || steps.extract_dry_run.outputs.transcript_json || steps.skipped.outputs.transcript_json }}
      transcript_summary: ${{ steps.extract.outputs.transcript_summary || steps.extract_dry_run.outputs.transcript_summary || steps.skipped.outputs.transcript_summary }}
      engine_data_json: ${{ steps.engine-data.outputs.engine_data_json || steps.skipped.outputs.engine_data_json }}
      auth_mode: ${{ steps.auth-mode.outputs.auth_mode || steps.skipped.outputs.auth_mode }}
    steps:
      - name: Record skipped agent run
        id: skipped
        if: ${{ ! inputs.run_agent }}
        run: |
          set -euo pipefail
          printf 'job_status=skipped\n' >> "$GITHUB_OUTPUT"
          printf 'transcript_json=\n' >> "$GITHUB_OUTPUT"
          printf 'transcript_summary=\n' >> "$GITHUB_OUTPUT"
          printf 'engine_data_json={}\n' >> "$GITHUB_OUTPUT"
          printf 'auth_mode=skipped\n' >> "$GITHUB_OUTPUT"

      - name: Checkout consumer repo
        if: ${{ inputs.run_agent }}
        uses: actions/checkout@v4

      - name: Checkout homeboy-extensions
        if: ${{ inputs.run_agent }}
        uses: actions/checkout@v4
        with:
          repository: Extra-Chill/homeboy-extensions
          ref: ${{ inputs.homeboy_extensions_ref }}
          path: .ci/homeboy-extensions

      - name: Set up Node.js
        if: ${{ inputs.run_agent }}
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Detect Homeboy app credentials
        id: homeboy-app-creds
        if: ${{ inputs.run_agent }}
        env:
          HOMEBOY_APP_ID: ${{ secrets.HOMEBOY_APP_ID }}
          HOMEBOY_APP_PRIVATE_KEY: ${{ secrets.HOMEBOY_APP_PRIVATE_KEY }}
        run: node .ci/homeboy-extensions/.github/scripts/datamachine-agent-ci/auth.cjs detect-credentials

      - name: Require Homeboy app credentials
        if: ${{ inputs.run_agent && ! inputs.dry_run && inputs.require_homeboy_app_token && steps.homeboy-app-creds.outputs.available != 'true' }}
        run: |
          set -euo pipefail
          cat >&2 <<'EOF'
          HOMEBOY_APP_ID and HOMEBOY_APP_PRIVATE_KEY are required for this Data Machine agent run.
          The workflow was configured with require_homeboy_app_token=true so repository-scoped
          GITHUB_TOKEN fallback is not allowed. Add the Homeboy app secrets to the caller repo
          or organization and rerun the workflow.
          EOF
          exit 1

      - name: Resolve Homeboy app token scope
        id: token-scope
        if: ${{ inputs.run_agent && ! inputs.dry_run && steps.homeboy-app-creds.outputs.available == 'true' }}
        env:
          APP_TOKEN_REPOS: ${{ inputs.app_token_repos }}
          TARGET_REPO: ${{ inputs.target_repo }}
          CONTEXT_REPOSITORIES: ${{ inputs.context_repositories }}
        run: node .ci/homeboy-extensions/.github/scripts/datamachine-agent-ci/auth.cjs resolve-token-scope

      - name: Generate Homeboy app token
        id: app-token
        if: ${{ inputs.run_agent && ! inputs.dry_run && steps.homeboy-app-creds.outputs.available == 'true' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.HOMEBOY_APP_ID }}
          private-key: ${{ secrets.HOMEBOY_APP_PRIVATE_KEY }}
          owner: ${{ steps.token-scope.outputs.owner }}
          repositories: ${{ steps.token-scope.outputs.repositories }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Report GitHub auth mode
        id: auth-mode
        if: ${{ inputs.run_agent }}
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_TOKEN_OWNER: ${{ steps.token-scope.outputs.owner }}
          APP_TOKEN_REPOSITORIES: ${{ steps.token-scope.outputs.repositories }}
          APP_TOKEN_REPOS_INPUT: ${{ inputs.app_token_repos }}
          TARGET_REPO: ${{ inputs.target_repo }}
          CONTEXT_REPOSITORIES: ${{ inputs.context_repositories }}
          REQUIRE_HOMEBOY_APP_TOKEN: ${{ inputs.require_homeboy_app_token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node .ci/homeboy-extensions/.github/scripts/datamachine-agent-ci/auth.cjs report-mode

      - name: Checkout validation dependencies
        if: ${{ inputs.run_agent }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          VALIDATION_DEPENDENCIES: ${{ inputs.validation_dependencies }}
          INCLUDE_AGENT_RUNTIME_DEPENDENCIES: ${{ inputs.include_agent_runtime_dependencies }}
          AGENT_RUNTIME: ${{ inputs.agent_runtime }}
          AGENT_RUNTIME_REF: ${{ inputs.agent_runtime_ref }}
          AGENTS_API_REF: ${{ inputs.agents_api_ref }}
          DATA_MACHINE_REF: ${{ inputs.data_machine_ref }}
          DATA_MACHINE_CODE_REF: ${{ inputs.data_machine_code_ref }}
          OPENAI_PROVIDER_REF: ${{ inputs.openai_provider_ref }}
          PROVIDER: ${{ inputs.provider }}
          PROVIDER_PLUGIN: ${{ inputs.provider_plugin }}
        run: node .ci/homeboy-extensions/.github/scripts/datamachine-agent-ci/materialize-dependencies.cjs

      - name: Download workflow input artifacts
        if: ${{ inputs.run_agent && inputs.actions_artifact_downloads != '[]' && inputs.actions_artifact_downloads != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIONS_ARTIFACT_DOWNLOADS: ${{ inputs.actions_artifact_downloads }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ACTIONS_ARTIFACT_DOWNLOADS" | jq -e 'type == "array"' >/dev/null
          while IFS= read -r item; do
            [ -n "$item" ] || continue
            repo="$(jq -r '.repo // env.GITHUB_REPOSITORY' <<< "$item")"
            run_id="$(jq -r '.run_id // .runId // ""' <<< "$item")"
            name="$(jq -r '.name // .artifact_name // .artifactName // ""' <<< "$item")"
            dir="$(jq -r '.dir // .destination // (".ci/actions-artifacts/" + $name)' --arg name "$(jq -r '.name // .artifact_name // .artifactName // ""' <<< "$item")" <<< "$item")"
            [ -n "$repo" ] || { echo "Artifact download repo is required" >&2; exit 1; }
            [ -n "$run_id" ] || { echo "Artifact download run_id is required" >&2; exit 1; }
            [ -n "$name" ] || { echo "Artifact download name is required" >&2; exit 1; }
            mkdir -p "$dir"
            gh run download "$run_id" --repo "$repo" --name "$name" --dir "$dir"
          done < <(printf '%s' "$ACTIONS_ARTIFACT_DOWNLOADS" | jq -c '.[]')

      - name: Build execute-workflow payload
        if: ${{ inputs.run_agent && inputs.execute_workflow_builder_command != '' }}
        shell: bash
        env:
          EXECUTE_WORKFLOW_BUILDER_COMMAND: ${{ inputs.execute_workflow_builder_command }}
        run: |
          set -euo pipefail
          bash -lc "$EXECUTE_WORKFLOW_BUILDER_COMMAND"

      - name: Install and build runtime dependencies
        if: ${{ inputs.run_agent }}
        env:
          PROVIDER: ${{ inputs.provider }}
          PROVIDER_PLUGIN: ${{ inputs.provider_plugin }}
        run: node .ci/homeboy-extensions/.github/scripts/datamachine-agent-ci/setup-runtime.cjs

      - name: Pre-flight bundle validation
        if: ${{ inputs.run_agent && inputs.bundle_validator_spec != '' }}
        run: php .ci/homeboy-extensions/wordpress/scripts/agent/validate-bundle.php "${{ inputs.bundle_validator_spec }}"

      - name: Build runner config
        id: config
        if: ${{ inputs.run_agent }}
        env:
          AGENT_SLUG: ${{ inputs.agent_slug }}
          PIPELINE_SLUG: ${{ inputs.pipeline_slug }}
          FLOW_SLUG: ${{ inputs.flow_slug }}
          BUNDLE_PATH: ${{ inputs.bundle_path }}
          BUNDLE_REPO: ${{ inputs.bundle_repo }}
          BUNDLE_REF: ${{ inputs.bundle_ref }}
          BUNDLE_PATH_IN_REPO: ${{ inputs.bundle_path_in_repo }}
          TARGET_REPO: ${{ inputs.target_repo }}
          CONTEXT_REPOSITORIES: ${{ inputs.context_repositories }}
          VERIFICATION_COMMANDS: ${{ inputs.verification_commands }}
          DRIFT_CHECKS: ${{ inputs.drift_checks }}
          WRITABLE_PATHS: ${{ inputs.writable_paths }}
          WORKSPACE_CONTRACT_CHECKS: ${{ inputs.workspace_contract_checks }}
          PROMPT: ${{ inputs.prompt }}
          PROVIDER: ${{ inputs.provider }}
          MODEL: ${{ inputs.model }}
          AGENT_RUNTIME: ${{ inputs.agent_runtime }}
          AGENT_RUNTIME_REF: ${{ inputs.agent_runtime_ref }}
          RUNTIME_WORDPRESS_VERSION: ${{ inputs.runtime_wordpress_version }}
          SUCCESS_REQUIRES_PR: ${{ inputs.success_requires_pr }}
          SUCCESS_COMPLETION_OUTCOMES: ${{ inputs.success_completion_outcomes }}
          MAX_TURNS: ${{ inputs.max_turns }}
          STEP_BUDGET: ${{ inputs.step_budget }}
          TIME_BUDGET_MS: ${{ inputs.time_budget_ms }}
          EXPECTED_ARTIFACTS: ${{ inputs.expected_artifacts }}
          ARTIFACT_DECLARATIONS: ${{ inputs.artifact_declarations }}
          ARTIFACT_EXPORT_CONFIG: ${{ inputs.artifact_export_config }}
          RULES: ${{ inputs.rules }}
          GENERAL_RULES: ${{ inputs.general_rules }}
          TASK_RULES: ${{ inputs.task_rules }}
          PROBES: ${{ inputs.probes }}
          WP_GYM_BENCHMARK_MODE: ${{ inputs.wp_gym_benchmark_mode }}
          DRY_RUN: ${{ inputs.dry_run }}
          EXTRA_WP_CONFIG_DEFINES: ${{ inputs.extra_wp_config_defines }}
          RUNTIME_MOUNTS: ${{ inputs.runtime_mounts }}
          RUNTIME_OVERLAYS: ${{ inputs.runtime_overlays }}
          WORKLOAD_RUN_BEFORE: ${{ inputs.workload_run_before }}
          WORKLOAD_RUN_AFTER: ${{ inputs.workload_run_after }}
          DAILY_MEMORY_ENABLED: ${{ inputs.daily_memory_enabled }}
          DISABLE_DATAMACHINE_DIRECTIVES: ${{ inputs.disable_datamachine_directives }}
          EXTRA_REQUIRED_ABILITIES: ${{ inputs.extra_required_abilities }}
          APP_TOKEN_REPOS: ${{ inputs.app_token_repos }}
          ALLOWED_REPOS: ${{ inputs.allowed_repos }}
          ENGINE_KEY: ${{ inputs.engine_key }}
          TOOL_RESULTS_KEY: ${{ inputs.tool_results_key }}
          ABILITY_TOOLS: ${{ inputs.ability_tools }}
          TOOL_RECORDERS: ${{ inputs.tool_recorders }}
          ENABLE_TERMINAL_ACTIONS: ${{ inputs.enable_terminal_actions }}
          WP_CLI_TOOL_NAME: ${{ inputs.wp_cli_tool_name }}
          PIPELINE_STEP_PATCHES: ${{ inputs.pipeline_step_patches }}
          FLOW_STEP_PATCHES: ${{ inputs.flow_step_patches }}
          RUNNER_WORKSPACE_CONFIG: ${{ inputs.runner_workspace }}
          EXECUTE_WORKFLOW_PATH: ${{ inputs.execute_workflow_path }}
          GITHUB_APP_TOKEN_VALUE: ${{ steps.app-token.outputs.token }}
          GITHUB_REPOSITORY_TOKEN_VALUE: ${{ github.token }}
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT_VALUE: ${{ github.run_attempt }}
          PROVIDER_PLUGIN: ${{ inputs.provider_plugin }}
          OPENAI_PROVIDER_REF: ${{ inputs.openai_provider_ref }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PROVIDER_SECRET_1: ${{ secrets.PROVIDER_SECRET_1 }}
          PROVIDER_SECRET_2: ${{ secrets.PROVIDER_SECRET_2 }}
          PROVIDER_SECRET_3: ${{ secrets.PROVIDER_SECRET_3 }}
          PROVIDER_SECRET_4: ${{ secrets.PROVIDER_SECRET_4 }}
          PROVIDER_SECRET_5: ${{ secrets.PROVIDER_SECRET_5 }}
        run: node .ci/homeboy-extensions/.github/scripts/datamachine-agent-ci/build-runner-config.cjs

      - name: Run Data Machine agent
        if: ${{ inputs.run_agent }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HOMEBOY_GITHUB_APP_TOKEN: ${{ steps.app-token.outputs.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PROVIDER_SECRET_1: ${{ secrets.PROVIDER_SECRET_1 }}
          PROVIDER_SECRET_2: ${{ secrets.PROVIDER_SECRET_2 }}
          PROVIDER_SECRET_3: ${{ secrets.PROVIDER_SECRET_3 }}
          PROVIDER_SECRET_4: ${{ secrets.PROVIDER_SECRET_4 }}
          PROVIDER_SECRET_5: ${{ secrets.PROVIDER_SECRET_5 }}
          HOMEBOY_DATAMACHINE_AGENT_RESULTS_FILE: ${{ runner.temp }}/run-results.json
          HOMEBOY_AGENT_TASK_OUTCOME_FILE: ${{ runner.temp }}/agent-task-outcome.json
          HOMEBOY_DATAMACHINE_AGENT_REPLAY_BUNDLE_DIR: ${{ inputs.replay_bundle_artifact_name != '' && format('{0}/datamachine-agent-replay-bundles', runner.temp) || '' }}
        run: node .ci/homeboy-extensions/wordpress/scripts/agent/run-datamachine-agent-task.cjs "${{ steps.config.outputs.config_path }}"

      - name: Run host runner lifecycle
        if: ${{ inputs.run_agent && ! inputs.dry_run }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          RESULTS_FILE: ${{ runner.temp }}/run-results.json
          CONFIG_FILE: ${{ steps.config.outputs.config_path }}
        run: |
          set -euo pipefail
          node .ci/homeboy-extensions/wordpress/scripts/agent/run-host-runner-lifecycle.cjs \
            --results "$RESULTS_FILE" \
            --config "$CONFIG_FILE" \
            --scenario "${{ inputs.flow_slug }}" \
            --workspace "$GITHUB_WORKSPACE"

      - name: Extract scenario outputs
        id: extract
        if: ${{ always() && inputs.run_agent && ! inputs.dry_run }}
        env:
          RESULTS_FILE: ${{ runner.temp }}/run-results.json
        run: |
          set -euo pipefail
          bash .ci/homeboy-extensions/wordpress/scripts/agent/extract-engine-data.sh \
            --results "$RESULTS_FILE" \
            --scenario "${{ inputs.flow_slug }}" \
            --field job_status=metadata.job_status \
            --field transcript_json='(.metadata.evidence_references.references.transcript_artifact.path // "")' \
            --field transcript_summary='(.metadata.evidence_references.references.transcript_artifact.label // "")' \
            --required-status "" \
            --to-github-output

      - name: Update runner workspace PR summary
        if: ${{ always() && inputs.run_agent && ! inputs.dry_run }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          RESULTS_FILE: ${{ runner.temp }}/run-results.json
          CONFIG_FILE: ${{ steps.config.outputs.config_path }}
        run: |
          set -euo pipefail
          node .ci/homeboy-extensions/wordpress/scripts/agent/update-runner-workspace-pr.cjs \
            --results "$RESULTS_FILE" \
            --config "$CONFIG_FILE" \
            --scenario "${{ inputs.flow_slug }}"

      - name: Extract dry-run outputs
        id: extract_dry_run
        if: ${{ always() && inputs.run_agent && inputs.dry_run }}
        env:
          RESULTS_FILE: ${{ runner.temp }}/run-results.json
        run: |
          set -euo pipefail
          bash .ci/homeboy-extensions/wordpress/scripts/agent/extract-engine-data.sh \
            --results "$RESULTS_FILE" \
            --scenario "${{ inputs.flow_slug }}" \
            --field job_status=metadata.agent_slug \
            --field transcript_json=metadata.bundle_path \
            --field transcript_summary=metadata.flow_slug \
            --required-status "" \
            --to-github-output
          printf 'job_status=completed\n' >> "$GITHUB_OUTPUT"

      - name: Project engine_data outputs
        id: engine-data
        if: ${{ inputs.run_agent }}
        env:
          RESULTS_FILE: ${{ runner.temp }}/run-results.json
          ENGINE_DATA_OUTPUTS: ${{ inputs.engine_data_outputs }}
          FLOW_SLUG: ${{ inputs.flow_slug }}
        run: node .ci/homeboy-extensions/.github/scripts/datamachine-agent-ci/project-engine-data.cjs

      - name: Assert success
        if: ${{ inputs.run_agent && ! inputs.dry_run }}
        env:
          RESULTS_FILE: ${{ runner.temp }}/run-results.json
          FLOW_SLUG: ${{ inputs.flow_slug }}
          SUCCESS_REQUIRES_PR: ${{ inputs.success_requires_pr }}
        run: node .ci/homeboy-extensions/.github/scripts/datamachine-agent-ci/assert-success.cjs

      - name: Resolve transcript artifact path
        id: transcript-artifact
        if: ${{ always() && inputs.run_agent && inputs.transcript_artifact_name != '' && (steps.extract.outputs.transcript_json != '' || steps.extract_dry_run.outputs.transcript_json != '') }}
        env:
          RESULTS_FILE: ${{ runner.temp }}/run-results.json
          FLOW_SLUG: ${{ inputs.flow_slug }}
          TRANSCRIPT_JSON: ${{ steps.extract.outputs.transcript_json || steps.extract_dry_run.outputs.transcript_json }}
          TRANSCRIPT_HOST_DIR: ${{ steps.config.outputs.transcript_host_dir }}
        run: node .ci/homeboy-extensions/.github/scripts/datamachine-agent-ci/artifacts-and-comments.cjs resolve-transcript

      - name: Upload transcript artifact
        if: ${{ always() && inputs.run_agent && inputs.transcript_artifact_name != '' && steps.transcript-artifact.outputs.path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.transcript_artifact_name }}
          path: ${{ steps.transcript-artifact.outputs.path }}
          if-no-files-found: error

      - name: Upload agent results artifact
        if: ${{ always() && inputs.run_agent && inputs.transcript_artifact_name != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.transcript_artifact_name }}-results
          path: ${{ runner.temp }}/run-results.json
          if-no-files-found: warn

      - name: Upload replay bundle artifact
        if: ${{ always() && inputs.run_agent && inputs.replay_bundle_artifact_name != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.replay_bundle_artifact_name }}
          path: ${{ runner.temp }}/datamachine-agent-replay-bundles
          if-no-files-found: error

      - name: Comment PR summary
        if: ${{ inputs.run_agent && inputs.comment_pr_summary && github.event_name == 'pull_request' && ! inputs.dry_run }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          AGENT_SLUG: ${{ inputs.agent_slug }}
          FLOW_SLUG: ${{ inputs.flow_slug }}
          JOB_STATUS: ${{ steps.extract.outputs.job_status }}
          TRANSCRIPT_ARTIFACT_NAME: ${{ inputs.transcript_artifact_name }}
          ENGINE_DATA_JSON: ${{ steps.engine-data.outputs.engine_data_json }}
        run: node .ci/homeboy-extensions/.github/scripts/datamachine-agent-ci/artifacts-and-comments.cjs prepare-pr-comment

      - name: Comment prepared PR summary
        if: ${{ inputs.run_agent && inputs.comment_pr_summary && github.event_name == 'pull_request' && ! inputs.dry_run }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          set -euo pipefail
          gh pr comment "${{ github.event.pull_request.number }}" --body-file "${RUNNER_TEMP}/datamachine-agent-comment.md"
