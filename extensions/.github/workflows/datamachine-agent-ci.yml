# Reusable wrapper for Data Machine agent CI runs.
#
# Consumers receive one stable `engine_data_json` output. GitHub Actions cannot
# create dynamic workflow_call outputs from `engine_data_outputs`, so callers
# should parse that JSON map in their own workflow when they need named fields.
name: Data Machine Agent CI (reusable)

'on':
  workflow_call:
    inputs:
      bundle_path:
        type: string
        required: true
      bundle_repo:
        description: Optional git URL for an external bundle repository. When set, the runner clones this repo and uses bundle_path_in_repo inside it.
        type: string
        default: ""
      bundle_ref:
        description: Ref to check out from bundle_repo. Defaults to the current workflow SHA when bundle_repo is empty.
        type: string
        default: ""
      bundle_path_in_repo:
        description: Path to the bundle inside bundle_repo. Defaults to bundle_path.
        type: string
        default: ""
      agent_slug:
        type: string
        required: true
      pipeline_slug:
        type: string
        required: true
      flow_slug:
        type: string
        required: true
      target_repo:
        type: string
        required: true
      prompt:
        type: string
        default: ""
      provider:
        type: string
        default: openai
      model:
        type: string
        default: gpt-5.5
      validation_dependencies:
        description: Comma-separated OWNER/REPO or OWNER/REPO@REF entries checked out under .ci/<repo>. Entries without @REF use the repository default branch.
        type: string
        default: ""
      playground_wordpress:
        type: string
        default: "7.0"
      success_requires_pr:
        type: boolean
        default: true
      success_completion_outcomes:
        description: |
          JSON array of Data Machine completion outcome names that may satisfy
          success_requires_pr when no PR is opened. File writes without PRs
          still fail. Default '[]' preserves PR-required behavior.
        type: string
        default: "[]"
      max_turns:
        type: number
        default: 12
      step_budget:
        type: number
        default: 16
      time_budget_ms:
        type: number
        default: 600000
      engine_data_outputs:
        description: JSON map of output_name to jq path, collected into engine_data_json.
        type: string
        default: "{}"
      transcript_artifact_name:
        description: Empty string disables transcript artifact upload.
        type: string
        default: ""
      artifact_export_config:
        description: JSON config for exporting job artifacts back to the target repo. Empty object uses the reusable workflow defaults.
        type: string
        default: "{}"
      comment_pr_summary:
        type: boolean
        default: false
      bundle_validator_spec:
        description: Optional repo-relative validate-bundle spec JSON path.
        type: string
        default: ""
      app_token_repos:
        description: Comma-separated OWNER/REPO entries for the Homeboy app token. Defaults to target_repo.
        type: string
        default: ""
      allowed_repos:
        description: JSON array of OWNER/REPO strings the injected GitHub profile may access. Defaults to [target_repo].
        type: string
        default: "[]"
      engine_key:
        description: Optional engine data key used by built-in tool result capture and fallback pull request recording.
        type: string
        default: ""
      tool_results_key:
        description: Engine data field used for captured tool results.
        type: string
        default: github_tool_results
      dry_run:
        description: Build runner config and exercise the runner dry-run path without a live agent call.
        type: boolean
        default: false
      extra_wp_config_defines:
        description: |
          JSON object merged into the runner config wp_config_defines.
          Default '{}' means no extra defines.
        type: string
        default: "{}"
      extra_playground_file_mounts:
        description: |
          JSON array appended to the runner config playground_file_mounts after
          the default ci-driver fixture mount. Use for plugin drop-ins,
          must-use plugin mounts, or any consumer-specific Playground file
          placement. Default '[]' means no extra mounts.
        type: string
        default: "[]"
      workload_run_before:
        description: |
          JSON array of pre-run hooks executed before the main bench workload
          inside Playground. Each entry is { type, file } the same way
          playground_workloads[*].run entries are. Default '[]' means no
          pre-run hook.
        type: string
        default: "[]"
      workload_run_after:
        description: |
          JSON array of post-run hooks executed after the agent workload inside
          the same Playground scenario. Use this for verifier probes that assert
          the agent left WordPress in a valid state. Default '[]' means no
          post-run hook.
        type: string
        default: "[]"
      daily_memory_enabled:
        description: |
          When true, sets daily_memory_enabled in the runner config so the
          imported agent runs with daily memory storage on. Default false.
        type: boolean
        default: false
      extra_required_abilities:
        description: |
          JSON array of additional ability slugs the runner must assert are
          registered before invoking the agent. Default '[]' means rely on
          the runner's built-in ability set (datamachine/import-agent,
          datamachine/run-flow, datamachine/drain-job).
        type: string
        default: "[]"
      ability_tools:
        description: JSON array of additional tool definitions backed by WordPress abilities.
        type: string
        default: "[]"
      tool_recorders:
        description: JSON array of existing tool recorder configs for field projection, forced parameters, and tool result capture.
        type: string
        default: "[]"
      pipeline_step_patches:
        description: JSON array of patches applied to imported pipeline step configs before the flow runs.
        type: string
        default: "[]"
      flow_step_patches:
        description: JSON array of patches applied to imported flow step configs before the flow runs.
        type: string
        default: "[]"
      runner_workspace:
        description: JSON object for runner-owned Data Machine Code workspace/worktree provisioning before the agent runs.
        type: string
        default: "{}"
      fallback_pull_request:
        description: JSON object describing a fallback PR to open or reuse when files were written but the agent did not open a PR.
        type: string
        default: "{}"
    secrets:
      HOMEBOY_APP_ID:
        required: false
      HOMEBOY_APP_PRIVATE_KEY:
        required: false
      OPENAI_API_KEY:
        required: true
    outputs:
      job_status:
        value: ${{ jobs.run-agent.outputs.job_status }}
      transcript_json:
        value: ${{ jobs.run-agent.outputs.transcript_json }}
      transcript_summary:
        value: ${{ jobs.run-agent.outputs.transcript_summary }}
      engine_data_json:
        value: ${{ jobs.run-agent.outputs.engine_data_json }}

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      job_status: ${{ steps.extract.outputs.job_status || steps.extract_dry_run.outputs.job_status }}
      transcript_json: ${{ steps.extract.outputs.transcript_json || steps.extract_dry_run.outputs.transcript_json }}
      transcript_summary: ${{ steps.extract.outputs.transcript_summary || steps.extract_dry_run.outputs.transcript_summary }}
      engine_data_json: ${{ steps.engine-data.outputs.engine_data_json }}
    steps:
      - name: Checkout consumer repo
        uses: actions/checkout@v4

      - name: Detect Homeboy app credentials
        id: homeboy-app-creds
        env:
          HOMEBOY_APP_ID: ${{ secrets.HOMEBOY_APP_ID }}
          HOMEBOY_APP_PRIVATE_KEY: ${{ secrets.HOMEBOY_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$HOMEBOY_APP_ID" ] && [ -n "$HOMEBOY_APP_PRIVATE_KEY" ]; then
            printf 'available=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'available=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve Homeboy app token scope
        id: token-scope
        if: ${{ ! inputs.dry_run && steps.homeboy-app-creds.outputs.available == 'true' }}
        env:
          APP_TOKEN_REPOS: ${{ inputs.app_token_repos }}
          TARGET_REPO: ${{ inputs.target_repo }}
        run: |
          set -euo pipefail
          repos_input="${APP_TOKEN_REPOS:-$TARGET_REPO}"
          IFS=',' read -ra entries <<< "$repos_input"
          owner=""
          repositories=()
          for raw_entry in "${entries[@]}"; do
            entry="$(printf '%s' "$raw_entry" | xargs)"
            [ -n "$entry" ] || continue
            case "$entry" in
              */*) ;;
              *) echo "app_token_repos entries must be OWNER/REPO: $entry" >&2; exit 1 ;;
            esac
            entry_owner="${entry%%/*}"
            repo_name="${entry#*/}"
            if [ -z "$owner" ]; then
              owner="$entry_owner"
            elif [ "$owner" != "$entry_owner" ]; then
              echo "actions/create-github-app-token supports one owner per token; got $owner and $entry_owner" >&2
              exit 1
            fi
            repositories+=("$repo_name")
          done
          [ -n "$owner" ] || { echo "No repositories resolved for app token." >&2; exit 1; }
          {
            printf 'owner=%s\n' "$owner"
            printf 'repositories=%s\n' "$(IFS=','; printf '%s' "${repositories[*]}")"
          } >> "$GITHUB_OUTPUT"

      - name: Generate Homeboy app token
        id: app-token
        if: ${{ ! inputs.dry_run && steps.homeboy-app-creds.outputs.available == 'true' }}
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.HOMEBOY_APP_ID }}
          private-key: ${{ secrets.HOMEBOY_APP_PRIVATE_KEY }}
          owner: ${{ steps.token-scope.outputs.owner }}
          repositories: ${{ steps.token-scope.outputs.repositories }}

      - name: Checkout homeboy-extensions
        uses: actions/checkout@v4
        with:
          repository: Extra-Chill/homeboy-extensions
          path: .ci/homeboy-extensions

      - name: Checkout validation dependencies
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          VALIDATION_DEPENDENCIES: ${{ inputs.validation_dependencies }}
        run: |
          set -euo pipefail
          [ -n "$VALIDATION_DEPENDENCIES" ] || exit 0
          IFS=',' read -ra entries <<< "$VALIDATION_DEPENDENCIES"
          for raw_entry in "${entries[@]}"; do
            entry="$(printf '%s' "$raw_entry" | xargs)"
            [ -n "$entry" ] || continue
            repo_ref="$entry"
            ref=""
            if [[ "$entry" == *@* ]]; then
              repo_ref="${entry%@*}"
              ref="${entry##*@}"
            fi
            if [ -z "$repo_ref" ] || [[ "$repo_ref" != */* ]]; then
              echo "validation_dependencies entries must be OWNER/REPO or OWNER/REPO@REF: $entry" >&2
              exit 1
            fi
            if [[ "$entry" == *@* && -z "$ref" ]]; then
              echo "validation_dependencies entries must include a non-empty ref after @: $entry" >&2
              exit 1
            fi
            if [ -z "$ref" ]; then
              ref="$(gh repo view "$repo_ref" --json defaultBranchRef --jq '.defaultBranchRef.name')"
              [ -n "$ref" ] || { echo "Could not resolve default branch for validation dependency: $repo_ref" >&2; exit 1; }
            fi
            repo_name="${repo_ref#*/}"
            target=".ci/$repo_name"
            rm -rf "$target"
            echo "Checking out validation dependency $repo_ref@$ref into $target"
            gh repo clone "$repo_ref" "$target" -- --depth=1
            git -C "$target" fetch --depth=1 origin "$ref"
            git -C "$target" checkout --quiet FETCH_HEAD
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Homeboy WordPress extension dependencies
        working-directory: .ci/homeboy-extensions/wordpress
        run: |
          set -euo pipefail
          composer install --no-interaction --no-progress --prefer-dist
          npm install

      - name: Install checked-out PHP dependencies
        run: |
          set -euo pipefail
          for composer_file in .ci/*/composer.json; do
            [ -f "$composer_file" ] || continue
            component_dir="$(dirname "$composer_file")"
            [ "$component_dir" != ".ci/homeboy-extensions" ] || continue
            [ "$component_dir" != ".ci/homeboy-extensions/wordpress" ] || continue
            composer install --working-dir="$component_dir" --no-interaction --no-progress --prefer-dist
          done

      - name: Pre-flight bundle validation
        if: ${{ inputs.bundle_validator_spec != '' }}
        run: php .ci/homeboy-extensions/wordpress/scripts/agent/validate-bundle.php "${{ inputs.bundle_validator_spec }}"

      - name: Build runner config
        id: config
        env:
          AGENT_SLUG: ${{ inputs.agent_slug }}
          PIPELINE_SLUG: ${{ inputs.pipeline_slug }}
          FLOW_SLUG: ${{ inputs.flow_slug }}
          BUNDLE_PATH: ${{ inputs.bundle_path }}
          BUNDLE_REPO: ${{ inputs.bundle_repo }}
          BUNDLE_REF: ${{ inputs.bundle_ref }}
          BUNDLE_PATH_IN_REPO: ${{ inputs.bundle_path_in_repo }}
          TARGET_REPO: ${{ inputs.target_repo }}
          PROMPT: ${{ inputs.prompt }}
          PROVIDER: ${{ inputs.provider }}
          MODEL: ${{ inputs.model }}
          PLAYGROUND_WORDPRESS: ${{ inputs.playground_wordpress }}
          SUCCESS_REQUIRES_PR: ${{ inputs.success_requires_pr }}
          SUCCESS_COMPLETION_OUTCOMES: ${{ inputs.success_completion_outcomes }}
          MAX_TURNS: ${{ inputs.max_turns }}
          STEP_BUDGET: ${{ inputs.step_budget }}
          TIME_BUDGET_MS: ${{ inputs.time_budget_ms }}
          ARTIFACT_EXPORT_CONFIG: ${{ inputs.artifact_export_config }}
          DRY_RUN: ${{ inputs.dry_run }}
          EXTRA_WP_CONFIG_DEFINES: ${{ inputs.extra_wp_config_defines }}
          EXTRA_PLAYGROUND_FILE_MOUNTS: ${{ inputs.extra_playground_file_mounts }}
          WORKLOAD_RUN_BEFORE: ${{ inputs.workload_run_before }}
          WORKLOAD_RUN_AFTER: ${{ inputs.workload_run_after }}
          DAILY_MEMORY_ENABLED: ${{ inputs.daily_memory_enabled }}
          EXTRA_REQUIRED_ABILITIES: ${{ inputs.extra_required_abilities }}
          ALLOWED_REPOS: ${{ inputs.allowed_repos }}
          ENGINE_KEY: ${{ inputs.engine_key }}
          TOOL_RESULTS_KEY: ${{ inputs.tool_results_key }}
          ABILITY_TOOLS: ${{ inputs.ability_tools }}
          TOOL_RECORDERS: ${{ inputs.tool_recorders }}
          PIPELINE_STEP_PATCHES: ${{ inputs.pipeline_step_patches }}
          FLOW_STEP_PATCHES: ${{ inputs.flow_step_patches }}
          RUNNER_WORKSPACE: ${{ inputs.runner_workspace }}
          FALLBACK_PULL_REQUEST: ${{ inputs.fallback_pull_request }}
          GITHUB_TOKEN_VALUE: ${{ steps.app-token.outputs.token || github.token }}
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT_VALUE: ${{ github.run_attempt }}
          OPENAI_API_KEY_VALUE: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          config_path="${RUNNER_TEMP}/datamachine-agent-config.json"
          bundle_abs="${GITHUB_WORKSPACE}/${BUNDLE_PATH}"
          bundle_repo_value="${BUNDLE_REPO:-https://github.com/${TARGET_REPO}.git}"
          bundle_ref_value="${BUNDLE_REF:-$GITHUB_SHA}"
          bundle_path_in_repo_value="${BUNDLE_PATH_IN_REPO:-$BUNDLE_PATH}"
          component_slug="$(basename "$GITHUB_WORKSPACE")"
          transcript_host_dir="${GITHUB_WORKSPACE}/datamachine-agent-artifacts/${AGENT_SLUG}"
          transcript_guest_dir="/wordpress/wp-content/plugins/${component_slug}/datamachine-agent-artifacts/${AGENT_SLUG}"
          mapfile -t validation_paths < <(find "${GITHUB_WORKSPACE}/.ci" -mindepth 1 -maxdepth 1 -type d | sort)
          validation_json="$(printf '%s\n' "${validation_paths[@]}" | jq -Rsc 'split("\n") | map(select(. != ""))')"
          validate_json_input() {
            local name="$1"
            local expected_type="$2"
            local value="$3"
            if ! jq -ce --arg expected_type "$expected_type" 'if type == $expected_type then . else error("expected " + $expected_type + ", got " + type) end' <<< "$value"; then
              echo "Invalid $name: expected JSON $expected_type." >&2
              return 1
            fi
          }
          extra_wp_config_defines_json="$(validate_json_input extra_wp_config_defines object "$EXTRA_WP_CONFIG_DEFINES")"
          extra_playground_file_mounts_json="$(validate_json_input extra_playground_file_mounts array "$EXTRA_PLAYGROUND_FILE_MOUNTS")"
          workload_run_before_json="$(validate_json_input workload_run_before array "$WORKLOAD_RUN_BEFORE")"
          workload_run_after_json="$(validate_json_input workload_run_after array "$WORKLOAD_RUN_AFTER")"
          extra_required_abilities_json="$(validate_json_input extra_required_abilities array "$EXTRA_REQUIRED_ABILITIES")"
          success_completion_outcomes_json="$(validate_json_input success_completion_outcomes array "$SUCCESS_COMPLETION_OUTCOMES")"
          allowed_repos_json="$(validate_json_input allowed_repos array "$ALLOWED_REPOS")"
          ability_tools_json="$(validate_json_input ability_tools array "$ABILITY_TOOLS")"
          tool_recorders_json="$(validate_json_input tool_recorders array "$TOOL_RECORDERS")"
          pipeline_step_patches_json="$(validate_json_input pipeline_step_patches array "$PIPELINE_STEP_PATCHES")"
          flow_step_patches_json="$(validate_json_input flow_step_patches array "$FLOW_STEP_PATCHES")"
          runner_workspace_json="$(validate_json_input runner_workspace object "$RUNNER_WORKSPACE")"
          fallback_pull_request_json="$(validate_json_input fallback_pull_request object "$FALLBACK_PULL_REQUEST")"
          jq -n \
            --arg componentPath "$GITHUB_WORKSPACE" \
            --arg bundlePath "$bundle_abs" \
            --arg bundlePathInRepo "$bundle_path_in_repo_value" \
            --arg bundleRepo "$bundle_repo_value" \
            --arg bundleRef "$bundle_ref_value" \
            --arg agentSlug "$AGENT_SLUG" \
            --arg pipelineSlug "$PIPELINE_SLUG" \
            --arg flowSlug "$FLOW_SLUG" \
            --arg targetRepo "$TARGET_REPO" \
            --arg prompt "$PROMPT" \
            --arg provider "$PROVIDER" \
            --arg model "$MODEL" \
            --arg engineKey "$ENGINE_KEY" \
            --arg toolResultsKey "$TOOL_RESULTS_KEY" \
            --arg playgroundWordPress "$PLAYGROUND_WORDPRESS" \
            --arg transcriptGuestDir "$transcript_guest_dir" \
            --arg githubToken "$GITHUB_TOKEN_VALUE" \
            --arg githubRunId "$GITHUB_RUN_ID_VALUE" \
            --arg githubRunAttempt "$GITHUB_RUN_ATTEMPT_VALUE" \
            --arg openaiKey "$OPENAI_API_KEY_VALUE" \
            --argjson validationDependencies "$validation_json" \
            --argjson artifactExportConfig "$ARTIFACT_EXPORT_CONFIG" \
            --argjson successRequiresPr "$SUCCESS_REQUIRES_PR" \
            --argjson successCompletionOutcomes "$success_completion_outcomes_json" \
            --argjson maxTurns "$MAX_TURNS" \
            --argjson stepBudget "$STEP_BUDGET" \
            --argjson timeBudgetMs "$TIME_BUDGET_MS" \
            --argjson dryRun "$DRY_RUN" \
            --argjson extraWpConfigDefines "$extra_wp_config_defines_json" \
            --argjson extraPlaygroundFileMounts "$extra_playground_file_mounts_json" \
            --argjson workloadRunBefore "$workload_run_before_json" \
            --argjson workloadRunAfter "$workload_run_after_json" \
            --argjson dailyMemoryEnabled "$DAILY_MEMORY_ENABLED" \
            --argjson extraRequiredAbilities "$extra_required_abilities_json" \
            --argjson allowedRepos "$allowed_repos_json" \
            --argjson abilityTools "$ability_tools_json" \
            --argjson toolRecorders "$tool_recorders_json" \
            --argjson pipelineStepPatches "$pipeline_step_patches_json" \
            --argjson flowStepPatches "$flow_step_patches_json" \
            --argjson runnerWorkspace "$runner_workspace_json" \
            --argjson fallbackPullRequest "$fallback_pull_request_json" \
            '{
              component_id: "datamachine-agent-ci-driver",
              component_path: $componentPath,
              workload_id: $flowSlug,
              workload_label: ("Run " + $agentSlug + " Data Machine agent"),
              validation_dependencies: $validationDependencies,
              playground_wordpress_version: $playgroundWordPress,
              playground_file_mounts: ([
                {
                  from_dependency: "homeboy-extensions",
                  from: "wordpress/tests/fixtures/datamachine-agent-ci-driver/datamachine-agent-ci-driver.php",
                  to: "/wordpress/wp-content/plugins/datamachine-agent-ci-driver/datamachine-agent-ci-driver.php"
                }
              ] + $extraPlaygroundFileMounts),
              wp_config_defines: $extraWpConfigDefines,
              workload_run_before: $workloadRunBefore,
              workload_run_after: $workloadRunAfter,
              required_abilities: (["datamachine/import-agent", "datamachine/run-flow", "datamachine/drain-job"] + $extraRequiredAbilities | reduce .[] as $ability ([]; if index($ability) then . else . + [$ability] end)),
              bundle_path: $bundlePath,
              bundle_repo: $bundleRepo,
              bundle_ref: $bundleRef,
              bundle_path_in_repo: $bundlePathInRepo,
              agent_slug: $agentSlug,
              pipeline_slug: $pipelineSlug,
              flow_slug: $flowSlug,
              provider: $provider,
              model: $model,
              provider_register_function: (if $provider == "openai" then "WordPress\\OpenAiAiProvider\\register_provider" else "" end),
              provider_credentials: (if $provider == "openai" then {connectors_ai_openai_api_key: "OPENAI_API_KEY"} else {} end),
              github_token_env: "GITHUB_TOKEN",
              github_profile_id: ($agentSlug + "-ci"),
              target_repo: $targetRepo,
              allowed_repos: (if ($allowedRepos | length) > 0 then $allowedRepos else [$targetRepo] end),
              engine_key: $engineKey,
              tool_results_key: $toolResultsKey,
              max_turns: $maxTurns,
              prompt: $prompt,
              step_budget: $stepBudget,
              time_budget_ms: $timeBudgetMs,
              ability_tools: $abilityTools,
              tool_recorders: $toolRecorders,
              pipeline_step_patches: $pipelineStepPatches,
              flow_step_patches: $flowStepPatches,
              runner_workspace: $runnerWorkspace,
              fallback_pull_request: $fallbackPullRequest,
              success_requires_pr: $successRequiresPr,
              success_completion_outcomes: $successCompletionOutcomes,
              artifact_export: ({
                enabled: true,
                only_when_no_pr: true,
                repo: $targetRepo,
                path_prefix: $bundlePathInRepo,
                branch_template: "agent-artifacts/{agent_slug}-{run_id}-{job_id}",
                commit_message_template: "chore: persist {type} artifact",
                pr_title_template: "Persist agent run artifacts",
                pr_body_template: "## Summary\n- Persist bundle-file run artifacts from Data Machine agent job {job_id}.\n\n## Artifacts\n{paths}\n"
              } * $artifactExportConfig),
              dry_run: $dryRun,
              transcript_dir: $transcriptGuestDir,
              bench_env: {
                GITHUB_TOKEN: $githubToken,
                GITHUB_RUN_ID: $githubRunId,
                GITHUB_RUN_ATTEMPT: $githubRunAttempt,
                OPENAI_API_KEY: $openaiKey
              }
            } + (if $dailyMemoryEnabled then {daily_memory_enabled: true} else {} end)' > "$config_path"
          printf 'config_path=%s\n' "$config_path" >> "$GITHUB_OUTPUT"
          printf 'transcript_host_dir=%s\n' "$transcript_host_dir" >> "$GITHUB_OUTPUT"

      - name: Run Data Machine agent
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HOMEBOY_DATAMACHINE_AGENT_RESULTS_FILE: ${{ runner.temp }}/run-results.json
        run: bash .ci/homeboy-extensions/wordpress/scripts/agent/run-datamachine-agent.sh "${{ steps.config.outputs.config_path }}"

      - name: Extract scenario outputs
        id: extract
        if: ${{ ! inputs.dry_run }}
        env:
          RESULTS_FILE: ${{ runner.temp }}/run-results.json
        run: |
          set -euo pipefail
          bash .ci/homeboy-extensions/wordpress/scripts/agent/extract-engine-data.sh \
            --results "$RESULTS_FILE" \
            --scenario "${{ inputs.flow_slug }}" \
            --field job_status=metadata.job_status \
            --field transcript_json=metadata.transcript_artifacts.json \
            --field transcript_summary=metadata.transcript_artifacts.summary \
            --required-status "" \
            --to-github-output

      - name: Extract dry-run outputs
        id: extract_dry_run
        if: ${{ inputs.dry_run }}
        env:
          RESULTS_FILE: ${{ runner.temp }}/run-results.json
        run: |
          set -euo pipefail
          bash .ci/homeboy-extensions/wordpress/scripts/agent/extract-engine-data.sh \
            --results "$RESULTS_FILE" \
            --scenario "${{ inputs.flow_slug }}" \
            --field job_status=metadata.agent_slug \
            --field transcript_json=metadata.bundle_path \
            --field transcript_summary=metadata.flow_slug \
            --required-status "" \
            --to-github-output
          printf 'job_status=completed\n' >> "$GITHUB_OUTPUT"

      - name: Project engine_data outputs
        id: engine-data
        env:
          RESULTS_FILE: ${{ runner.temp }}/run-results.json
          ENGINE_DATA_OUTPUTS: ${{ inputs.engine_data_outputs }}
        run: |
          set -euo pipefail
          if [ "$ENGINE_DATA_OUTPUTS" = "{}" ] || [ -z "$ENGINE_DATA_OUTPUTS" ]; then
            printf 'engine_data_json={}\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          scenario_json="$(jq -ec --arg scenario "${{ inputs.flow_slug }}" '.scenarios[] | select(.id == $scenario)' "$RESULTS_FILE")"
          projected="{}"
          while IFS=$'\t' read -r key path; do
            [ -n "$key" ] || continue
            jq_path="$path"
            case "$jq_path" in .*) ;; *) jq_path=".$jq_path" ;; esac
            value="$(jq -c "($jq_path) // null" <<< "$scenario_json")"
            projected="$(jq -c --arg key "$key" --argjson value "$value" '. + {($key): $value}' <<< "$projected")"
          done < <(jq -r 'to_entries[] | [.key, .value] | @tsv' <<< "$ENGINE_DATA_OUTPUTS")
          {
            printf 'engine_data_json<<EOF\n'
            printf '%s\n' "$projected"
            printf 'EOF\n'
          } >> "$GITHUB_OUTPUT"

      - name: Assert success
        if: ${{ inputs.success_requires_pr && ! inputs.dry_run }}
        env:
          RESULTS_FILE: ${{ runner.temp }}/run-results.json
        run: |
          set -euo pipefail
          bash .ci/homeboy-extensions/wordpress/scripts/agent/extract-engine-data.sh \
            --results "$RESULTS_FILE" \
            --scenario "${{ inputs.flow_slug }}" \
            --field job_status=metadata.job_status \
            --required-status completed

      - name: Resolve transcript artifact path
        id: transcript-artifact
        if: ${{ always() && inputs.transcript_artifact_name != '' && (steps.extract.outputs.transcript_json != '' || steps.extract_dry_run.outputs.transcript_json != '') }}
        env:
          RESULTS_FILE: ${{ runner.temp }}/run-results.json
          FLOW_SLUG: ${{ inputs.flow_slug }}
          TRANSCRIPT_JSON: ${{ steps.extract.outputs.transcript_json || steps.extract_dry_run.outputs.transcript_json }}
          TRANSCRIPT_HOST_DIR: ${{ steps.config.outputs.transcript_host_dir }}
        run: |
          set -euo pipefail
          transcript_path=""
          if [ -n "$TRANSCRIPT_JSON" ] && [ -f "$TRANSCRIPT_JSON" ]; then
            transcript_path="$TRANSCRIPT_JSON"
          elif [ -n "$TRANSCRIPT_JSON" ] && [ -n "$TRANSCRIPT_HOST_DIR" ]; then
            candidate="${TRANSCRIPT_HOST_DIR}/$(basename "$TRANSCRIPT_JSON")"
            if [ -f "$candidate" ]; then
              transcript_path="$candidate"
            fi
          fi
          if [ -z "$transcript_path" ] && [ -f "$RESULTS_FILE" ]; then
            transcript_content_path="${RUNNER_TEMP}/datamachine-agent-transcripts/$(basename "${TRANSCRIPT_JSON:-job-transcript.json}")"
            if jq -e --arg scenario "$FLOW_SLUG" '.scenarios[] | select(.id == $scenario) | .metadata.transcript_artifacts.content? // empty' "$RESULTS_FILE" >/dev/null; then
              mkdir -p "$(dirname "$transcript_content_path")"
              jq -r --arg scenario "$FLOW_SLUG" '.scenarios[] | select(.id == $scenario) | .metadata.transcript_artifacts.content' "$RESULTS_FILE" > "$transcript_content_path"
              transcript_path="$transcript_content_path"
            fi
          fi
          if [ -z "$transcript_path" ]; then
            echo "Transcript artifact file not found for path: $TRANSCRIPT_JSON"
            exit 0
          fi
          printf 'path=%s\n' "$transcript_path" >> "$GITHUB_OUTPUT"

      - name: Upload transcript artifact
        if: ${{ always() && inputs.transcript_artifact_name != '' && steps.transcript-artifact.outputs.path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.transcript_artifact_name }}
          path: ${{ steps.transcript-artifact.outputs.path }}
          if-no-files-found: error

      - name: Comment PR summary
        if: ${{ inputs.comment_pr_summary && github.event_name == 'pull_request' && ! inputs.dry_run }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          AGENT_SLUG: ${{ inputs.agent_slug }}
          FLOW_SLUG: ${{ inputs.flow_slug }}
          JOB_STATUS: ${{ steps.extract.outputs.job_status }}
          TRANSCRIPT_ARTIFACT_NAME: ${{ inputs.transcript_artifact_name }}
          ENGINE_DATA_JSON: ${{ steps.engine-data.outputs.engine_data_json }}
        run: |
          set -euo pipefail
          body_file="${RUNNER_TEMP}/datamachine-agent-comment.md"
          {
            printf '## Data Machine Agent CI\n\n'
            printf -- '- Agent: `%s`\n' "$AGENT_SLUG"
            printf -- '- Flow: `%s`\n' "$FLOW_SLUG"
            printf -- '- Job status: `%s`\n' "${JOB_STATUS:-unknown}"
            if [ -n "$TRANSCRIPT_ARTIFACT_NAME" ]; then
              printf -- '- Transcript artifact: `%s`\n' "$TRANSCRIPT_ARTIFACT_NAME"
            fi
            if [ -n "$ENGINE_DATA_JSON" ] && [ "$ENGINE_DATA_JSON" != "{}" ]; then
              printf -- '- Engine data: `%s`\n' "$ENGINE_DATA_JSON"
            fi
          } > "$body_file"
          gh pr comment "${{ github.event.pull_request.number }}" --body-file "$body_file"
