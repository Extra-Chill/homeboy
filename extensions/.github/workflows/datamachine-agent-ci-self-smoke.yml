name: Data Machine Agent CI self-smoke

'on':
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  self-smoke:
    uses: ./.github/workflows/datamachine-agent-ci.yml
    with:
      bundle_path: tests/fixtures/datamachine-agent-self-smoke/bundles/self-smoke-agent
      agent_slug: self-smoke-agent
      pipeline_slug: self-smoke-pipeline
      flow_slug: self-smoke-flow
      target_repo: Extra-Chill/homeboy-extensions
      prompt: Acknowledge this self-smoke run with a single line and stop. Do not call any GitHub tools.
      success_requires_pr: false
      dry_run: true
      extra_wp_config_defines: '{"FIXTURE_DEFINE":"hello"}'
      engine_data_outputs: '{}'
    secrets:
      HOMEBOY_APP_ID: ${{ secrets.HOMEBOY_APP_ID }}
      HOMEBOY_APP_PRIVATE_KEY: ${{ secrets.HOMEBOY_APP_PRIVATE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  generic-provider-smoke:
    uses: ./.github/workflows/datamachine-agent-ci.yml
    with:
      bundle_path: tests/fixtures/datamachine-agent-self-smoke/bundles/self-smoke-agent
      agent_slug: self-smoke-agent
      pipeline_slug: self-smoke-pipeline
      flow_slug: self-smoke-generic-provider-flow
      target_repo: Extra-Chill/homeboy-extensions
      prompt: Exercise the generic provider plugin config path in dry-run mode.
      provider: example-provider
      model: example-model
      success_requires_pr: false
      dry_run: true
      provider_plugin: |
        {
          "repo": "WordPress/ai-provider-for-openai",
          "ref": "trunk",
          "path": ".",
          "register_function": "",
          "credentials": {
            "connectors_ai_example_api_key": "PROVIDER_SECRET_1"
          }
        }
      engine_data_outputs: '{}'
    secrets:
      HOMEBOY_APP_ID: ${{ secrets.HOMEBOY_APP_ID }}
      HOMEBOY_APP_PRIVATE_KEY: ${{ secrets.HOMEBOY_APP_PRIVATE_KEY }}
      PROVIDER_SECRET_1: ${{ secrets.PROVIDER_SECRET_1 }}

  wp-codebox-runtime-smoke:
    uses: ./.github/workflows/datamachine-agent-ci.yml
    with:
      bundle_path: tests/fixtures/datamachine-agent-self-smoke/bundles/self-smoke-agent
      agent_slug: self-smoke-agent
      pipeline_slug: self-smoke-pipeline
      flow_slug: self-smoke-wp-codebox-flow
      target_repo: Extra-Chill/homeboy-extensions
      prompt: Exercise the WP Codebox agent runtime path in dry-run mode.
      agent_runtime: wp-codebox
      success_requires_pr: false
      dry_run: true
      engine_data_outputs: '{}'
    secrets:
      HOMEBOY_APP_ID: ${{ secrets.HOMEBOY_APP_ID }}
      HOMEBOY_APP_PRIVATE_KEY: ${{ secrets.HOMEBOY_APP_PRIVATE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
