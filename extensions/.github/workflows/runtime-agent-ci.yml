name: Runtime Agent CI (reusable)

on:
  workflow_call:
    inputs:
      runtime:
        description: Agent runtime id. Preferred alias for runtime_provider.
        required: false
        type: string
        default: ''
      backend:
        description: Compatibility alias for runtime_provider; use runtime for new callers.
        required: false
        type: string
        default: ''
      runtime_provider:
        description: Runtime provider identifier. Prefer runtime for new callers.
        required: false
        type: string
        default: ''
      provider:
        description: Model/provider identifier forwarded to the runtime.
        required: false
        type: string
        default: ''
      model:
        description: Model identifier forwarded to the runtime.
        required: false
        type: string
        default: ''
      runtime_profile:
        description: Runtime profile id to select from runtime_profiles.
        required: false
        type: string
        default: ''
      profile:
        description: Preferred alias for runtime_profile.
        required: false
        type: string
        default: ''
      runtime_profiles:
        description: JSON object keyed by runtime profile id.
        required: true
        type: string
      runtime_component_paths:
        description: JSON object mapping runtime component keys to workspace paths.
        required: false
        type: string
        default: '{}'
      ignored_workspace_paths:
        description: JSON array of workspace paths ignored by drift/status checks.
        required: false
        type: string
        default: '[]'
      runtime_task:
        description: JSON object with ability and input keys. Use runtime_execution for generic bundle or workflow descriptors.
        required: false
        type: string
        default: '{}'
      runtime_execution:
        description: JSON object describing a generic ability, bundle, or workflow execution.
        required: false
        type: string
        default: '{}'
      workload:
        description: JSON workload DTO forwarded to the runtime config.
        required: false
        type: string
        default: '{}'
      tool_policy:
        description: JSON runtime tool-policy DTO forwarded to the runtime config.
        required: false
        type: string
        default: '{}'
      runtime_output_projections:
        description: JSON map of output names to provider runtime result paths.
        required: false
        type: string
        default: '{}'
      evidence_projections:
        description: JSON array mapping provider operation results to named runtime outputs or artifact refs.
        required: false
        type: string
        default: '[]'
      ability_requirements:
        description: JSON array of required ability/tool identifiers.
        required: false
        type: string
        default: '[]'
      ability_tools:
        description: JSON array of tool declarations made available to the runtime.
        required: false
        type: string
        default: '[]'
      artifact_slots:
        description: JSON array/object declaring expected artifact slots.
        required: false
        type: string
        default: '[]'
      artifact_declarations:
        description: JSON array of runtime artifact declaration DTOs.
        required: false
        type: string
        default: '[]'
      transcript_slots:
        description: JSON array/object declaring transcript slots.
        required: false
        type: string
        default: '[]'
      task_timeout_seconds:
        description: Runtime task timeout in seconds.
        required: false
        type: number
        default: 900
    outputs:
      runtime_config_path:
        description: Path to the validated runtime config envelope.
        value: ${{ jobs.prepare.outputs.runtime_config_path }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      runtime_config_path: ${{ steps.config.outputs.runtime_config_path }}
    steps:
      - uses: actions/checkout@v4
      - id: config
        shell: bash
        env:
          RUNTIME_PROVIDER: ${{ inputs.runtime_provider }}
          RUNTIME: ${{ inputs.runtime }}
          BACKEND: ${{ inputs.backend }}
          PROVIDER: ${{ inputs.provider }}
          MODEL: ${{ inputs.model }}
          RUNTIME_PROFILE: ${{ inputs.runtime_profile }}
          PROFILE: ${{ inputs.profile }}
          RUNTIME_PROFILES: ${{ inputs.runtime_profiles }}
          RUNTIME_COMPONENT_PATHS: ${{ inputs.runtime_component_paths }}
          IGNORED_WORKSPACE_PATHS: ${{ inputs.ignored_workspace_paths }}
          RUNTIME_TASK: ${{ inputs.runtime_task }}
          RUNTIME_EXECUTION: ${{ inputs.runtime_execution }}
          WORKLOAD: ${{ inputs.workload }}
          TOOL_POLICY: ${{ inputs.tool_policy }}
          RUNTIME_OUTPUT_PROJECTIONS: ${{ inputs.runtime_output_projections }}
          EVIDENCE_PROJECTIONS: ${{ inputs.evidence_projections }}
          ABILITY_REQUIREMENTS: ${{ inputs.ability_requirements }}
          ABILITY_TOOLS: ${{ inputs.ability_tools }}
          ARTIFACT_SLOTS: ${{ inputs.artifact_slots }}
          ARTIFACT_DECLARATIONS: ${{ inputs.artifact_declarations }}
          TRANSCRIPT_SLOTS: ${{ inputs.transcript_slots }}
          TASK_TIMEOUT_SECONDS: ${{ inputs.task_timeout_seconds }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const {
            runtimeAgentCiTaskExecutorConfig,
          } = require('./runtime-agent-ci');
          const { normalizeRuntimeId } = require('./runtime-agent-ci/lib/runtime-provider-resolver.cjs');

          function parseJson(name, fallback) {
            const value = process.env[name];
            if (!value) {
              return fallback;
            }
            return JSON.parse(value);
          }

          const runtimeTask = parseJson('RUNTIME_TASK', {});
          const runtimeProvider = normalizeRuntimeId(process.env.RUNTIME || process.env.RUNTIME_PROVIDER || process.env.BACKEND);
          const runtimeProfile = process.env.PROFILE || process.env.RUNTIME_PROFILE;
          if (!runtimeProfile) {
            throw new Error('profile or runtime_profile is required.');
          }
          const config = runtimeAgentCiTaskExecutorConfig({
            runtimeProvider,
            provider: process.env.PROVIDER || undefined,
            model: process.env.MODEL || undefined,
            runtimeProfile,
            runtimeProfiles: parseJson('RUNTIME_PROFILES', {}),
            runtimeComponentPaths: parseJson('RUNTIME_COMPONENT_PATHS', {}),
            ignoredWorkspacePaths: parseJson('IGNORED_WORKSPACE_PATHS', []),
            runtimeExecution: parseJson('RUNTIME_EXECUTION', {}),
            workload: parseJson('WORKLOAD', {}),
            toolPolicy: parseJson('TOOL_POLICY', {}),
            runtimeOutputProjections: parseJson('RUNTIME_OUTPUT_PROJECTIONS', {}),
            evidenceProjections: parseJson('EVIDENCE_PROJECTIONS', []),
            abilityInput: runtimeTask.input || {},
            ability: runtimeTask.ability,
            abilityRequirements: parseJson('ABILITY_REQUIREMENTS', []),
            abilityTools: parseJson('ABILITY_TOOLS', []),
            artifactSlots: parseJson('ARTIFACT_SLOTS', []),
            artifactDeclarations: parseJson('ARTIFACT_DECLARATIONS', []),
            transcriptSlots: parseJson('TRANSCRIPT_SLOTS', []),
            taskTimeoutSeconds: Number(process.env.TASK_TIMEOUT_SECONDS || 900),
          });

          const outputPath = path.join(process.cwd(), 'runtime-agent-ci-config.json');
          fs.writeFileSync(outputPath, `${JSON.stringify(config, null, 2)}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `runtime_config_path=${outputPath}\n`);
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-agent-ci-config
          path: runtime-agent-ci-config.json
