name: Data Machine Agent CI compatibility smoke

'on':
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  runtime-agent-full-run-generic-boundary:
    uses: ./.github/workflows/runtime-agent-full-run.yml
    with:
      homeboy_extensions_ref: ${{ github.sha }}
      runtime_provider: wp-codebox
      runtime_ref: main
      runtime_profile: generic-boundary-smoke
      runtime_profiles: |
        {
          "generic-boundary-smoke": {
            "id": "generic-boundary-smoke",
            "runtime_task_ability": "example/acknowledge",
            "ability_requirements": ["example/acknowledge"]
          }
        }
      workload_id: generic-boundary-smoke
      target_repo: Extra-Chill/homeboy-extensions
      prompt: Exercise the generic runtime full-run dry-run path.
      runtime_task: '{"ability":"example/acknowledge","input":{"message":"hello"}}'
      success_requires_pr: false
      dry_run: true
      callback_data: '{"source":"compatibility-smoke"}'

  compatibility-bundle-smoke:
    uses: ./.github/workflows/datamachine-agent-ci.yml
    with:
      bundle_path: tests/fixtures/datamachine-agent-self-smoke/bundles/self-smoke-agent
      homeboy_extensions_ref: ${{ github.sha }}
      agent_slug: self-smoke-agent
      pipeline_slug: self-smoke-pipeline
      flow_slug: self-smoke-flow
      target_repo: Extra-Chill/homeboy-extensions
      context_repositories: |
        [
          {"repo":"Automattic/studio","ref":"trunk"},
          {"repo":"WordPress/agent-skills","ref":"trunk"}
        ]
      prompt: Acknowledge this self-smoke run with a single line and stop. Do not call any GitHub tools.
      success_requires_pr: false
      dry_run: true
      extra_wp_config_defines: '{"FIXTURE_DEFINE":"hello"}'
      engine_data_outputs: '{}'
    secrets:
      HOMEBOY_APP_ID: ${{ secrets.HOMEBOY_APP_ID }}
      HOMEBOY_APP_PRIVATE_KEY: ${{ secrets.HOMEBOY_APP_PRIVATE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  compatibility-provider-plugin-smoke:
    uses: ./.github/workflows/datamachine-agent-ci.yml
    with:
      bundle_path: tests/fixtures/datamachine-agent-self-smoke/bundles/self-smoke-agent
      homeboy_extensions_ref: ${{ github.sha }}
      agent_slug: self-smoke-agent
      pipeline_slug: self-smoke-pipeline
      flow_slug: self-smoke-generic-provider-flow
      target_repo: Extra-Chill/homeboy-extensions
      prompt: Exercise the generic provider plugin config path in dry-run mode.
      provider: example-provider
      model: example-model
      success_requires_pr: false
      dry_run: true
      provider_plugin: |
        {
          "repo": "WordPress/ai-provider-for-openai",
          "ref": "trunk",
          "path": ".",
          "register_function": "",
          "credentials": {
            "connectors_ai_example_api_key": "PROVIDER_SECRET_1"
          }
        }
      engine_data_outputs: '{}'
    secrets:
      HOMEBOY_APP_ID: ${{ secrets.HOMEBOY_APP_ID }}
      HOMEBOY_APP_PRIVATE_KEY: ${{ secrets.HOMEBOY_APP_PRIVATE_KEY }}
      PROVIDER_SECRET_1: ${{ secrets.PROVIDER_SECRET_1 }}

  compatibility-wp-codebox-runtime-smoke:
    uses: ./.github/workflows/datamachine-agent-ci.yml
    with:
      bundle_path: tests/fixtures/datamachine-agent-self-smoke/bundles/self-smoke-agent
      homeboy_extensions_ref: ${{ github.sha }}
      agent_slug: self-smoke-agent
      pipeline_slug: self-smoke-pipeline
      flow_slug: self-smoke-wp-codebox-flow
      target_repo: Extra-Chill/homeboy-extensions
      prompt: Exercise the WP Codebox agent runtime path in dry-run mode.
      success_requires_pr: false
      dry_run: true
      engine_data_outputs: '{}'
    secrets:
      HOMEBOY_APP_ID: ${{ secrets.HOMEBOY_APP_ID }}
      HOMEBOY_APP_PRIVATE_KEY: ${{ secrets.HOMEBOY_APP_PRIVATE_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
