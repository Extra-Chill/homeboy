# The fast command-contract gate validates checked-in reference pages without
# execution dependencies. This separate adapter gate proves its serialized
# projection still matches the runtime Clap tree when command definitions move.

name: CLI Reference Runtime Parity

on:
  pull_request:
    branches: [main]
    paths:
      - 'crates/homeboy-cli/src/cli_surface/**'
      - 'crates/homeboy-cli/src/commands/**'
      - 'crates/homeboy-cli/Cargo.toml'
      - 'crates/contracts/homeboy-command-contract/**'
      - 'docs/reference/cli/**'
      - 'Cargo.lock'
      - '.github/workflows/cli-reference-parity.yml'
  workflow_dispatch:

jobs:
  cli-reference-runtime-parity:
    name: homeboy / CLI Reference Runtime Parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify the runtime Clap projection
        run: cargo test --locked -p homeboy-cli --lib cli_surface::reference_docs_tests::live_clap_reference_matches_serialized_contract
