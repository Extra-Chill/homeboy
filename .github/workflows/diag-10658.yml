# TEMPORARY diagnostic workflow for #10658. Delete before merge.
name: Diag 10658

on:
  push:
    branches: ['diag/**']

jobs:
  full:
    name: homeboy-agents full lib suite (default parallelism)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compile test binary
        run: cargo test --locked -p homeboy-agents --lib --no-run
      - name: Full agents lib suite
        run: timeout 2400 cargo test --locked -p homeboy-agents --lib || echo "EXIT=$?"
