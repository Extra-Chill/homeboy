# Keeps control-plane wire compatibility and the persisted schema baseline explicit.

name: Control Plane Contract Boundary

on:
  pull_request:
    branches: [main]
    paths:
      - 'crates/contracts/homeboy-control-plane-contract/**'
      - 'crates/homeboy-lab-runner/src/control_plane_client.rs'
      - 'crates/homeboy-core/src/observation/store/schema.rs'
      - 'crates/homeboy-core/tests/fixtures/observation-schema/**'
      - 'Cargo.lock'
      - '.github/workflows/control-plane-contract-boundary.yml'
  workflow_dispatch:

jobs:
  control-plane-contract-boundary:
    name: homeboy / Control Plane Contract Boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Verify v1 wire compatibility and the observation schema baseline
        run: |
          cargo test --locked -p homeboy-control-plane-contract --test v1_golden
          cargo test --locked -p homeboy-lab-runner control_plane_client::tests
          cargo test --locked -p homeboy-core --lib observation::store::schema::tests::
