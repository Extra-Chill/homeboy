# PR quality pipeline.

name: CI

# No `branches` filter: stacked PRs (non-main base) must run CI too. `edited`
# is required so retargeting a PR to a different base schedules the checks,
# since base changes are not one of the default activity types.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: write
  pull-requests: write
  issues: write

jobs:
  rustfmt:
    name: homeboy / Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  lint:
    name: homeboy / Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/checkout@v6
        with:
          repository: Extra-Chill/homeboy-action
          ref: v2
          path: .homeboy-action
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        continue-on-error: true
        with:
          client-id: ${{ secrets.HOMEBOY_APP_ID }}
          private-key: ${{ secrets.HOMEBOY_APP_PRIVATE_KEY }}
      - uses: ./.homeboy-action
        with:
          source: .
          component: homeboy
          commands: review lint
          expected-commands: review lint,review test
          differential-gating: true
          execution-timeout-seconds: '1800'
          test-timeout-seconds: '1500'
          setup-timeout-seconds: '2400'
          app-token: ${{ steps.app-token.outputs.token || github.token }}
          comment-section-key: lint
          comment-section-title: Lint

  homeboy:
    name: homeboy
    uses: Extra-Chill/homeboy-action/.github/workflows/ci.yml@b7b208f70c5a3c41b1189f7cbc6d474c8466dbcf
    with:
      commands: review test
      args: --skip-lint
      expected-commands: review lint,review test
      component: homeboy
      action-ref: b7b208f70c5a3c41b1189f7cbc6d474c8466dbcf
      extension-ref: 7b638cf9bf2ef69e19051e370e91864987e997a2
      source: .
      scope: auto
      differential-gating: 'true'
      baseline-commands: review test
      test-shards: '1'
      execution-timeout-seconds: '2100'
      test-timeout-seconds: '1800'
      setup-timeout-seconds: '2400'
      comment-section-key: test
      comment-section-title: Test
    secrets: inherit
