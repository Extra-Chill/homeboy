# PR quality pipeline.

name: CI

# No `branches` filter: stacked PRs (non-main base) must run CI too. `edited`
# is required so retargeting a PR to a different base schedules the checks,
# since base changes are not one of the default activity types.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Description/title edits retain the running verification. Source updates and
  # base retargets supersede it; `edited` remains enabled for stacked PRs.
  cancel-in-progress: ${{ github.event.action != 'edited' || github.event.changes.base != null }}

permissions:
  actions: read
  contents: write
  pull-requests: write
  issues: write

jobs:
  rustfmt:
    name: homeboy / Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  homeboy:
    name: homeboy
    uses: Extra-Chill/homeboy-action/.github/workflows/ci.yml@4bb926f084f7c853f0d3ad5b4d28bac4a47f7b06
    with:
      # Lint and Test share the prepared candidate binary and retain separate
      # checks/comment sections via the workflow's per-command defaults.
      # Keep --skip-lint test-local; shared args would pass it to review lint.
      commands: review lint,review test --skip-lint
      component: homeboy
      # Scoped differential baseline (homeboy-action#541, #542, #543).
      action-ref: 4bb926f084f7c853f0d3ad5b4d28bac4a47f7b06
      extension-ref: 7b638cf9bf2ef69e19051e370e91864987e997a2
      source: .
      scope: auto
      differential-gating: 'true'
      baseline-commands: review lint,review test --skip-lint
      test-shards: '1'
      execution-timeout-seconds: '2100'
      test-timeout-seconds: '1800'
      setup-timeout-seconds: '2400'
    secrets: inherit
