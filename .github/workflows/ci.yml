# PR quality pipeline.
#
# Keep these checks direct in this repository so PRs do not depend on an extra
# reusable-workflow planning job before actionable Audit/Lint/Test checks exist.

name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: write
  pull-requests: write
  issues: write

jobs:
  required-gates-policy:
    name: homeboy / Required Gates Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Validate required check contexts
        run: |
          bash .github/validate-required-gates.sh --local
          bash .github/test-manage-required-gates-ruleset.sh

  # Non-differential safety net for crate-topology changes. The `review test`
  # gate below is differentially scoped, so a crate extraction that orphans a
  # DONOR crate's test wiring (e.g. a test file left referencing a `super::foo`
  # module after `foo` moved to its own crate) can pass unnoticed — the donor
  # isn't in the changed scope. This job compiles EVERY crate's test target
  # (codegen-free, so it's cheap) and fails closed if any of them break.
  workspace-tests-compile:
    name: homeboy / Workspace Tests Compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile all workspace test targets
        run: cargo check --workspace --tests --locked

  # Unix-only `libc` constants (`SIGKILL` has no Windows definition) and other
  # cfg-gating misses compile fine on Linux (#10398). The release has no Windows
  # artifact consumer, so keep this codegen-free source check on every PR rather
  # than paying for a native release build. Deliberately no `--tests`: some
  # Unix-only test helpers rely on that boundary.
  windows-compile:
    name: homeboy / Windows Compile
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Check all workspace crates for Windows
        run: cargo check --workspace --locked

  # Keep `main` rustfmt-clean so a feature branch's `cargo fmt` only ever touches
  # the files it changed. Without this gate, unformatted files drift onto main
  # and get pulled into unrelated PRs (a bare `cargo fmt` reformats them, or a
  # `rustfmt mod.rs` cascades across the module tree), ballooning otherwise-small
  # diffs and forcing manual `git checkout --` of noise files (#6860). This is a
  # non-differential whole-workspace check, so it catches drift anywhere.
  rustfmt:
    name: homeboy / Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check workspace formatting
        run: cargo fmt --all --check

  cli-reference-docs:
    name: homeboy / CLI Reference Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Regenerate the CLI reference from clap
        env:
          HOMEBOY_WRITE_CLI_REFERENCE: '1'
        run: cargo test -p homeboy-cli --lib --locked cli_surface::reference_docs
      - name: Upload the regenerated CLI reference
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cli-reference-docs
          path: docs/reference/cli/commands
          if-no-files-found: warn
      - name: Fail if the checked-in CLI reference is stale
        run: |
          git add --intent-to-add -- docs/reference/cli/commands
          git diff --exit-code -- docs/reference/cli/commands

  homeboy:
    name: homeboy / ${{ matrix.title }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - command: review audit
            title: Audit
            section_key: audit
            section_title: Audit
            # Audit and Lint are nowhere near their budget; leave them at the
            # action defaults so raising the Test gate cannot mask a genuine
            # hang in either of them.
            execution_timeout_seconds: '1800'
            test_timeout_seconds: '1500'
          - command: review lint
            title: Lint
            section_key: lint
            section_title: Lint
            execution_timeout_seconds: '1800'
            test_timeout_seconds: '1500'
          - command: review test
            title: Test
            section_key: test
            section_title: Test
            # See #10639. Two budgets bound this gate, and the *inner* one is
            # the binding constraint that produced 17 false-red runs on
            # 2026-07-28:
            #
            #   test_timeout_seconds      -> HOMEBOY_TEST_TIMEOUT_SECONDS,
            #     enforced by Homeboy itself around the test child
            #     (DEFAULT_TEST_TIMEOUT_SECONDS = 25*60 in
            #     crates/homeboy-extension/src/test/run.rs). This is what
            #     actually fired at 1500s; the action's 1800s never got the
            #     chance.
            #   execution_timeout_seconds -> the action's outer wrapper.
            #
            # These are deliberately ordered inner < outer, with 300s of
            # margin. The inner path returns Homeboy's structured evidence
            # (counts, findings, retained output); the outer path SIGKILLs the
            # process group and loses it. The inner timeout must always win the
            # race, so the outer one is a backstop for a genuinely wedged
            # process rather than the normal exit.
            #
            # 2700s is 1.8x the ceiling that was being hit and roughly 2.3x a
            # median successful phase (~17-20 min once ~10 min of setup is
            # subtracted from the job). Worst case is 2 phases (candidate +
            # differential baseline) x 45 min + setup ~= 100 min, well inside
            # GitHub's 360-minute job cap.
            #
            # This raises the budget for *this* repository only. It is set here
            # rather than by changing the action's global default so other
            # homeboy-action consumers keep their existing bounds.
            execution_timeout_seconds: '3000'
            test_timeout_seconds: '2700'
    # Job-level env reaches the composite action's `run:` steps, and therefore
    # the `homeboy` child process, without needing an action input or an
    # action release. (Callers of the *reusable workflow* have no such path --
    # that gap is Extra-Chill/homeboy-action#303.)
    env:
      HOMEBOY_TEST_TIMEOUT_SECONDS: ${{ matrix.test_timeout_seconds }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Check out Homeboy Action
        uses: actions/checkout@v6
        with:
          repository: Extra-Chill/homeboy-action
          ref: v2
          path: .homeboy-action

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        continue-on-error: true
        with:
          app-id: ${{ secrets.HOMEBOY_APP_ID }}
          private-key: ${{ secrets.HOMEBOY_APP_PRIVATE_KEY }}

      - uses: ./.homeboy-action
        with:
          source: .
          component: homeboy
          commands: ${{ matrix.command }}
          expected-commands: review audit,review lint,review test
          differential-gating: true
          # Autofix is explicitly disabled on PRs: an on-failure autofix push
          # lands a bot commit mid-review and supersedes in-flight CI runs,
          # which reads as a spurious failure (see #3819). Require manual fixes.
          autofix: 'false'
          execution-timeout-seconds: ${{ matrix.execution_timeout_seconds }}
          app-token: ${{ steps.app-token.outputs.token || github.token }}
          comment-section-key: ${{ matrix.section_key }}
          comment-section-title: ${{ matrix.section_title }}
