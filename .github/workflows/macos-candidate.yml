# Short-lived native binary for a macOS control-plane recovery. This workflow
# deliberately has no release or CI quality jobs: dispatch selects the ref.
name: macOS Candidate Artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-candidate:
    name: homeboy / macOS Candidate Binary
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@1.95.0
      - name: Build native candidate binary
        run: cargo build --locked --release -p homeboy --bin homeboy
      - name: Verify candidate source identity
        run: |
          identity="$(target/release/homeboy --version)"
          case "${identity}" in
            *"${GITHUB_SHA:0:12}"*) ;;
            *) echo "Candidate identity '${identity}' does not contain ${GITHUB_SHA:0:12}" >&2; exit 1 ;;
          esac
      - uses: actions/upload-artifact@v7
        with:
          name: homeboy-macos-aarch64-candidate-${{ github.sha }}
          path: target/release/homeboy
          if-no-files-found: error
          retention-days: 1
