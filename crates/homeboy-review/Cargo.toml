[package]
name = "homeboy-review"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Review subsystem for homeboy: renders the scoped lint + test umbrella (the review command) into human- and machine-readable output. Depends on homeboy-core; core does not depend on it."
publish = false

[lib]
name = "homeboy_review"
path = "src/lib.rs"

[dependencies]
homeboy-core = { version = "0.1.0", path = "../homeboy-core" }
homeboy-extension-contract = { version = "0.1.0", path = "../contracts/homeboy-extension-contract" }
homeboy-finding = { version = "0.1.0", path = "../homeboy-finding" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"

[dev-dependencies]
homeboy-core = { version = "0.1.0", path = "../homeboy-core", features = ["test-support"] }
