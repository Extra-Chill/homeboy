[package]
name = "homeboy-agents"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Agent-task subsystem for homeboy: durable agent-task orchestration, controller loops, dispatch, promotion, and review. Depends on homeboy-core; core does not depend on it."
publish = false

[lib]
name = "homeboy_agents"
path = "src/lib.rs"

[dependencies]
homeboy-core = { version = "0.1.0", path = "../homeboy-core" }
homeboy-extension = { version = "0.1.0", path = "../homeboy-extension" }
homeboy-error = { version = "0.1.0", path = "../homeboy-error" }
homeboy-engine-primitives = { version = "0.1.0", path = "../homeboy-engine-primitives" }
homeboy-lab-contract = { version = "0.1.0", path = "../contracts/homeboy-lab-contract" }
homeboy-lab-runner-contract = { version = "0.1.0", path = "../contracts/homeboy-lab-runner-contract" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_json_path = "0.7"
chrono = "0.4"
uuid = { version = "1.11", features = ["v4", "v5", "serde"] }
sha2 = "0.10.9"
hmac = "0.12"
base64 = "0.22"
regex = "1.11"
libc = "0.2"
shellexpand = "3.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "blocking", "rustls-tls", "socks", "http2", "charset", "system-proxy"] }
tempfile = "3.14"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Threading"] }

[dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
homeboy-core = { version = "0.1.0", path = "../homeboy-core", features = ["test-support"] }
# Self-referencing dev-dependency: this crate's own integration tests link the
# library externally, where `cfg(test)` is off. Enabling `test-support` for the
# test build is what keeps the `fixture` executor double available to them while
# leaving it out of the shipped binary (#11118).
homeboy-agents = { version = "0.1.0", path = ".", features = ["test-support"] }

[features]
# Exposes the in-tree `fixture` agent-task executor double (and the test-only
# lifecycle record rewriters) to test builds. `fixture` is not a registered
# agent runtime: it has no provider manifest and is never resolved through the
# extension catalog, so it must never be compiled into a production binary.
# Enabled as a dev-dependency feature by homeboy-cli, homeboy-lab-runner, the
# `homeboy` binary crate, and this crate itself.
test-support = []
