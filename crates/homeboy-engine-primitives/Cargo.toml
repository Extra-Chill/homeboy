[package]
name = "homeboy-engine-primitives"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Chris Huber <chubes@extrachill.com>"]
description = "Low-level execution primitives (shell, command, text, run_dir, template, output parsing, identifiers) for homeboy"
repository = "https://github.com/Extra-Chill/homeboy"
publish = false

[lib]
name = "homeboy_engine_primitives"
path = "src/lib.rs"

[dependencies]
homeboy-error = { version = "0.1.0", path = "../homeboy-error" }
homeboy-paths = { version = "0.1.0", path = "../homeboy-paths" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Link-time inventory of every declared provider registry. Each
# `provider_registry!` expansion submits a descriptor so the CLI's
# registration completeness test can enumerate registries it was never told
# about, instead of the subsystem silently degrading to its no-op.
inventory = "0.3"
toml = "1.0.3"
regex = "1.11"
libc = "0.2"
sha2 = "0.10.9"

[dev-dependencies]
tempfile = "3.14"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
